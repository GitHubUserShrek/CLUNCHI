
[common]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
monitor_speed = 115200
board_build.partitions = huge_app.csv
extra_scripts = post:merge_bin.py
lib_deps =
    adafruit/Adafruit BusIO @ ^1.17.4
    bblanchon/ArduinoJson
    olikraus/U8g2 @ ^2.34.0
    h2zero/NimBLE-Arduino @ ^2.5.0
    mikalhart/TinyGPSPlus @ ^1.0.3
    https://github.com/mathieucarbou/ESPAsyncWebServer.git
    https://github.com/mathieucarbou/AsyncTCP.git
build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

; Lolin / Wemos C3 Super Mini
[env:lolin_c3_mini]
extends = common
board = lolin_c3_mini
board_build.flash_mode = dio
build_flags =
    ${common.build_flags}
    -DBOARD_C3_MINI

; Seeed XIAO ESP32-C5
[env:seeed_xiao_esp32c5]
extends = common
board = seeed_xiao_esp32c5
build_flags =
    ${common.build_flags}
    -DBOARD_XIAO_C5